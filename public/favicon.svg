  <!-- Outer Pure White QR Finder Frame -->
  <rect x="12" y="12" width="40" height="40" rx="6" fill="#FFFFFF" />
  
  <!-- Inner Red Gap -->
  <rect x="18" y="18" width="28" height="28" rx="3" fill="#DC2626" />
  
  <!-- Center Pure White Core -->
  <rect x="24" y="24" width="16" height="16" rx="2" fill="#FFFFFF" />
  
  <!-- Top-Right Dynamic Accent Dot (White) -->
  <rect x="44" y="12" width="8" height="8" rx="2" fill="#FFFFFF" />
  
  <!-- Bottom-Left Dynamic Accent Dot (White) -->
